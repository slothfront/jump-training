<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4f0e8">
<title>JUMP TRAINING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+JP:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== Reset / Vars ===== */
:root {
  --paper: #f4f0e8;
  --black: #1a1a1a;
  --pure-black: #000000;
  --red: #e63946;
  --blue: #1d4ed8;
  --yellow: #fbbf24;
  --line: #1a1a1a;
  --text-secondary: #6b6b6b;
  --text-tertiary: #999999;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  margin: 0;
  padding: 0;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

body {
  font-family: 'Space Grotesk', 'Noto Sans JP', sans-serif;
  background: var(--paper);
  color: var(--black);
  user-select: none;
  -webkit-user-select: none;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
  line-height: 1.4;
  position: relative;
  overflow-x: hidden;
}

/* ===== Background Geometry (per design system) ===== */
body::before {
  content: '';
  position: fixed;
  top: 4%; right: -22%;
  width: 42vw; height: 42vw;
  max-width: 380px; max-height: 380px;
  background: var(--red);
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  opacity: 0.95;
}

body::after {
  content: '';
  position: fixed;
  bottom: -12%; left: -14%;
  width: 32vw; height: 32vw;
  max-width: 320px; max-height: 320px;
  background: var(--yellow);
  pointer-events: none;
  z-index: 0;
  transform: rotate(45deg);
}

.bg-triangle {
  position: fixed;
  top: 50%;
  left: -10%;
  width: 0;
  height: 0;
  border-left: 70px solid transparent;
  border-right: 70px solid transparent;
  border-bottom: 140px solid var(--blue);
  pointer-events: none;
  z-index: 0;
  transform: rotate(20deg);
}

/* ===== App Layout ===== */
.app {
  max-width: 980px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
  padding: 16px;
}

/* ===== Header ===== */
.app-header {
  background: var(--paper);
  border: 3px solid var(--black);
  box-shadow: 4px 4px 0 var(--black);
  padding: 14px 18px;
  margin-bottom: 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.brand {
  display: flex;
  flex-direction: column;
  line-height: 1;
}

.brand-mark {
  font-family: 'Archivo Black', sans-serif;
  font-size: 18px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.brand-jp {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.16em;
  color: var(--text-secondary);
  text-transform: uppercase;
  margin-top: 6px;
}

/* ===== View Tabs (per design system: blue when active) ===== */
.view-tabs {
  display: flex;
  border: 3px solid var(--black);
}

.view-tab {
  padding: 8px 14px;
  border: none;
  border-right: 3px solid var(--black);
  background: var(--paper);
  font-family: 'Archivo Black', sans-serif;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: all 0.1s;
  color: var(--black);
}

.view-tab:last-child {
  border-right: none;
}

.view-tab.active {
  background: var(--blue);
  color: var(--paper);
}

/* ===== Day Selector ===== */
.day-tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border: 3px solid var(--black);
  box-shadow: 4px 4px 0 var(--black);
  background: var(--paper);
  margin-bottom: 22px;
}

.day-tab {
  padding: 14px 8px 10px;
  border: none;
  border-right: 3px solid var(--black);
  background: var(--paper);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: background 0.1s;
  position: relative;
}

.day-tab:last-child {
  border-right: none;
}

.day-tab .day-jp {
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 900;
  font-size: 22px;
  line-height: 1;
}

.day-tab .day-en {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--text-secondary);
}

.day-tab.active {
  background: var(--blue);
  color: var(--paper);
}

.day-tab.active .day-en {
  color: var(--paper);
}

/* 進捗マーカー（右下） */
.day-tab.status-done::after,
.day-tab.status-partial::after {
  content: '';
  position: absolute;
  bottom: 6px;
  right: 8px;
  width: 9px;
  height: 9px;
  border: 2px solid var(--black);
}

.day-tab.status-done::after {
  background: var(--blue);
}

.day-tab.status-partial::after {
  background: var(--paper);
  border: 2px solid var(--blue);
}

.day-tab.active.status-done::after {
  background: var(--paper);
  border-color: var(--paper);
}

.day-tab.active.status-partial::after {
  background: var(--blue);
  border-color: var(--paper);
}

/* ===== Card ===== */
.card {
  background: var(--paper);
  border: 3px solid var(--black);
  padding: 18px;
  margin-bottom: 22px;
  position: relative;
  box-shadow: 4px 4px 0 var(--black);
}

.section-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--black);
  display: block;
  margin-bottom: 6px;
}

/* ===== Hero ===== */
.menu-hero h1 {
  font-family: 'Archivo Black', sans-serif;
  font-size: clamp(30px, 7vw, 44px);
  font-weight: 900;
  letter-spacing: -0.04em;
  text-transform: uppercase;
  line-height: 0.92;
  margin: 6px 0 8px;
}

.menu-hero .menu-jp {
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 900;
  font-size: 17px;
  margin-bottom: 4px;
}

.menu-hero .menu-theme {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 14px;
}

.menu-meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.meta-tag {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 4px 8px;
  border: 2px solid var(--black);
  background: var(--paper);
}

.meta-tag.intensity-low { background: var(--paper); }
.meta-tag.intensity-mid { background: var(--yellow); }
.meta-tag.intensity-high { background: var(--red); color: var(--paper); }
.meta-tag.optional { background: var(--paper); border-style: dashed; }

/* ===== Progress ===== */
.progress-wrap {
  margin-top: 4px;
}

.progress-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}

.progress-count {
  font-family: 'Archivo Black', sans-serif;
  font-size: 22px;
  letter-spacing: -0.02em;
}

.progress-total {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-secondary);
}

.progress-bar {
  height: 14px;
  border: 3px solid var(--black);
  background: var(--paper);
  position: relative;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--blue);
  transition: width 0.3s;
}

/* ===== Done Stamp ===== */
.done-stamp-wrap {
  margin-bottom: 22px;
}

.done-stamp {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 14px 16px;
  border: 4px solid var(--red);
  background: var(--paper);
  transform: rotate(-1.2deg);
  box-shadow: 6px 6px 0 var(--red);
}

.done-stamp .stamp-text {
  font-family: 'Archivo Black', sans-serif;
  font-size: 18px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--red);
}

.done-stamp .stamp-jp {
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 900;
  font-size: 13px;
  color: var(--red);
}

/* ===== Exercise (button with full Bauhaus active anim) ===== */
.exercise {
  background: var(--paper);
  border: 3px solid var(--black);
  margin-bottom: 14px;
  padding: 14px 16px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
  position: relative;
  box-shadow: 4px 4px 0 var(--black);
  transition: all 0.1s;
  text-align: left;
  width: 100%;
}

.exercise.checked {
  background: var(--yellow);
}

.exercise:active {
  transform: translate(4px, 4px);
  box-shadow: 0 0 0 var(--black);
}

.checkbox {
  width: 28px;
  height: 28px;
  border: 3px solid var(--black);
  background: var(--paper);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 2px;
}

.exercise.checked .checkbox {
  background: var(--black);
}

.checkbox-mark {
  width: 16px;
  height: 16px;
  display: none;
}

.exercise.checked .checkbox-mark {
  display: block;
}

.exercise-body {
  flex: 1;
  min-width: 0;
}

.exercise-meta {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
}

.exercise-num {
  font-family: 'Archivo Black', sans-serif;
  font-size: 12px;
  letter-spacing: 0.06em;
}

.exercise-reps {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  background: var(--black);
  color: var(--paper);
  padding: 2px 8px;
}

.exercise.checked .exercise-reps {
  background: var(--paper);
  color: var(--black);
  border: 2px solid var(--black);
  padding: 0 6px;
}

.exercise-name {
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 900;
  font-size: 16px;
  margin-bottom: 8px;
  letter-spacing: -0.01em;
}

/* 各セクション（Why / How / Focus）の共通スタイル */
.ex-section {
  margin-top: 6px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--text-secondary);
}

.exercise.checked .ex-section {
  color: var(--black);
}

.ex-label {
  display: inline-block;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  background: var(--black);
  color: var(--paper);
  padding: 1px 6px;
  margin-right: 6px;
  vertical-align: 1px;
  font-weight: 500;
}

.exercise.checked .ex-label {
  background: var(--paper);
  color: var(--black);
  border: 1px solid var(--black);
  padding: 0 5px;
}

/* Why は太字で目立たせる（一番大事な情報） */
.ex-section.why .ex-text {
  font-weight: 700;
  color: var(--black);
}

/* Focus は赤いラベル */
.ex-section.focus .ex-label {
  background: var(--red);
  color: var(--paper);
}

.exercise.checked .ex-section.focus .ex-label {
  background: var(--red);
  color: var(--paper);
  border: 1px solid var(--black);
}

/* ===== Checkpoint ===== */
.checkpoint-card {
  background: var(--yellow);
  border: 3px solid var(--black);
  padding: 14px 16px;
  margin-bottom: 22px;
  box-shadow: 4px 4px 0 var(--black);
}

.checkpoint-card .section-label {
  margin-bottom: 6px;
}

.checkpoint-text {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.5;
}

/* ===== Stats Grid ===== */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 22px;
}

.stat-card {
  margin-bottom: 0;
  padding: 14px 16px;
}

.stat-card.streak {
  background: var(--red);
  color: var(--paper);
}

.stat-card.streak .section-label {
  color: var(--paper);
}

.stat-value {
  font-family: 'Archivo Black', sans-serif;
  font-size: clamp(36px, 9vw, 48px);
  letter-spacing: -0.04em;
  line-height: 0.9;
  margin-top: 4px;
}

.stat-unit {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  margin-left: 4px;
  letter-spacing: 0.1em;
}

/* ===== Calendar ===== */
.month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  border-bottom: 3px solid var(--black);
  padding-bottom: 10px;
}

.month-label {
  font-family: 'Archivo Black', sans-serif;
  font-size: 18px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.month-btn {
  width: 36px;
  height: 36px;
  border: 3px solid var(--black);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Archivo Black', sans-serif;
  font-size: 14px;
  background: var(--paper);
  transition: all 0.1s;
  box-shadow: 3px 3px 0 var(--black);
}

.month-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.month-btn:not(:disabled):active {
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 var(--black);
}

.weekday-header {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 4px;
}

.weekday-cell {
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 4px 0;
  font-weight: 500;
}

.weekday-cell.sun { color: var(--red); }
.weekday-cell.sat { color: var(--blue); }

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.cal-cell {
  aspect-ratio: 1 / 1;
  border: 2px solid transparent;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Archivo Black', sans-serif;
  font-size: 13px;
}

.cal-cell.empty {
  visibility: hidden;
}

.cal-cell.scheduled {
  border: 2px dashed var(--black);
}

.cal-cell.partial {
  border: 3px solid var(--black);
  background: var(--paper);
}

.cal-cell.partial::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 30%;
  background: var(--blue);
}

.cal-cell.done {
  border: 3px solid var(--black);
  background: var(--blue);
  color: var(--paper);
}

.cal-cell.today {
  outline: 3px solid var(--red);
  outline-offset: 2px;
}

.cal-cell.future {
  opacity: 0.35;
}

.cal-day {
  position: relative;
  z-index: 1;
}

.cal-mark {
  position: absolute;
  bottom: 2px;
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.1em;
  z-index: 1;
}

.cal-cell.done .cal-mark {
  color: var(--paper);
}

/* ===== Legend ===== */
.legend {
  margin-top: 18px;
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  gap: 8px 16px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 12px;
}

.legend-swatch {
  width: 18px;
  height: 18px;
  border: 2px solid var(--black);
  flex-shrink: 0;
}

.legend-swatch.done { background: var(--blue); }

.legend-swatch.partial {
  background: var(--paper);
  position: relative;
}

.legend-swatch.partial::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 30%;
  background: var(--blue);
}

.legend-swatch.scheduled {
  border: 2px dashed var(--black);
  background: transparent;
}

/* ===== Team Footer (per SLOTHFRONT spec) ===== */
.team-footer {
  margin-top: auto;
  padding: 36px 16px calc(40px + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
  user-select: none;
  text-align: center;
}

.team-footer .team-name {
  font-family: 'Archivo Black', sans-serif;
  font-weight: 900;
  font-size: clamp(18px, 5.5vw, 36px);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--black);
  display: inline-block;
  white-space: nowrap;
  background: var(--yellow);
  padding: 6px 16px;
  border: 4px solid var(--black);
  box-shadow: 6px 6px 0 var(--red);
}

.team-footer .team-sub {
  font-family: 'DM Mono', monospace;
  font-size: clamp(9px, 2.2vw, 11px);
  letter-spacing: 0.32em;
  color: var(--black);
  text-transform: uppercase;
  margin-top: 16px;
  font-weight: 500;
}

/* ===== Week Summary ===== */
.week-summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 22px;
}

.ws-cell {
  background: var(--paper);
  border: 3px solid var(--black);
  padding: 12px 14px;
  position: relative;
  box-shadow: 4px 4px 0 var(--black);
}

.ws-cell.streak {
  background: var(--red);
  color: var(--paper);
}

.ws-cell.streak .section-label {
  color: var(--paper);
}

.ws-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-top: 4px;
}

.ws-num {
  font-family: 'Archivo Black', sans-serif;
  font-size: clamp(28px, 7vw, 36px);
  letter-spacing: -0.04em;
  line-height: 0.9;
}

.ws-denom {
  font-family: 'DM Mono', monospace;
  font-size: 14px;
  color: var(--text-secondary);
  letter-spacing: 0.04em;
}

.ws-cell.streak .ws-denom {
  color: var(--paper);
  opacity: 0.7;
}

.ws-bar {
  margin-top: 8px;
  height: 8px;
  border: 2px solid var(--black);
  background: var(--paper);
  position: relative;
  overflow: hidden;
}

.ws-bar-fill {
  height: 100%;
  background: var(--blue);
  transition: width 0.3s;
}

.ws-bar-fill.complete {
  background: var(--yellow);
}

.ws-bonus {
  display: inline-block;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  background: var(--yellow);
  color: var(--black);
  padding: 1px 6px;
  margin-left: 4px;
  vertical-align: 4px;
  border: 1px solid var(--black);
}

/* 4日目以降の追加実施を強調表示 */
.ws-extra {
  display: inline-block;
  font-family: 'Archivo Black', sans-serif;
  font-size: 14px;
  letter-spacing: 0.02em;
  background: var(--yellow);
  color: var(--black);
  padding: 2px 8px;
  margin-left: 6px;
  border: 2px solid var(--black);
  vertical-align: 3px;
  box-shadow: 2px 2px 0 var(--black);
}

.ws-flame {
  display: inline-block;
  font-family: 'Archivo Black', sans-serif;
  font-size: 18px;
  margin-left: 4px;
  vertical-align: 2px;
}

/* ===== Modal ===== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(26, 26, 26, 0.7);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-overlay.active {
  display: flex;
}

.modal {
  background: var(--paper);
  border: 4px solid var(--black);
  box-shadow: 6px 6px 0 var(--red);
  padding: 24px;
  max-width: 460px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-greeting {
  margin-bottom: 18px;
}

.modal-title {
  font-family: 'Archivo Black', sans-serif;
  font-size: 26px;
  letter-spacing: -0.02em;
  margin: 6px 0 4px;
  display: block;
  background: none;
  padding: 0;
  text-transform: none;
}

#modal-today-jp {
  display: inline-block;
  background: var(--yellow);
  padding: 0 10px;
  margin: 0 4px;
  border: 3px solid var(--black);
  font-family: 'Archivo Black', sans-serif;
}

.modal-sub {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-secondary);
  margin-top: 6px;
}

/* 過去14日のhistory表示 */
.modal-history {
  margin-bottom: 18px;
  padding: 10px 12px;
  border: 2px solid var(--black);
  background: var(--paper);
}

.modal-history .section-label {
  margin-bottom: 8px;
}

.history-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.history-day {
  border: 2px solid var(--black);
  padding: 3px 1px;
  text-align: center;
  background: var(--paper);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 50px;
  position: relative;
}

.history-day.done {
  background: var(--blue);
  color: var(--paper);
}

.history-day.partial {
  background: var(--paper);
  overflow: hidden;
}

.history-day.partial::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 30%;
  background: var(--blue);
  z-index: 0;
}

.hd-date {
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.04em;
  font-weight: 500;
  position: relative;
  z-index: 1;
}

.hd-wd {
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 900;
  font-size: 12px;
  line-height: 1;
  position: relative;
  z-index: 1;
}

.history-day.weekend .hd-wd { color: inherit; }
.history-day:not(.done):not(.partial) .hd-wd.sun { color: var(--red); }
.history-day:not(.done):not(.partial) .hd-wd.sat { color: var(--blue); }

.hd-mark {
  font-family: 'Archivo Black', sans-serif;
  font-size: 9px;
  letter-spacing: 0.04em;
  position: relative;
  z-index: 1;
  min-height: 10px;
}

.modal-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}

.day-option {
  border: 3px solid var(--black);
  background: var(--paper);
  padding: 10px 12px;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 2px;
  box-shadow: 4px 4px 0 var(--black);
  transition: all 0.1s;
  cursor: pointer;
  min-height: 102px;
  position: relative;
}

.day-option:active {
  transform: translate(4px, 4px);
  box-shadow: 0 0 0 var(--black);
}

.day-option.recommended {
  background: var(--yellow);
}

.day-option.recommended::before {
  content: 'おすすめ';
  position: absolute;
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.16em;
  background: var(--red);
  color: var(--paper);
  padding: 1px 5px;
  margin-top: -22px;
  margin-left: -2px;
}

.day-option-jp {
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 900;
  font-size: 22px;
  line-height: 1;
}

.day-option-day {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-secondary);
  margin-top: 2px;
}

.day-option.recommended .day-option-day {
  color: var(--black);
}

.day-option-name {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.3;
  margin-top: 4px;
}

.modal-skip {
  width: 100%;
  padding: 10px;
  border: 2px solid var(--black);
  background: var(--paper);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.1s;
}

.modal-skip:active {
  background: var(--black);
  color: var(--paper);
}

.modal-skip.danger {
  border-color: var(--red);
  color: var(--red);
}

.modal-skip.danger:active {
  background: var(--red);
  color: var(--paper);
}

.past-edit-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

/* カレンダーセルをクリック可能に */
.cal-cell:not(.empty):not(.future) {
  cursor: pointer;
  transition: transform 0.05s;
}

.cal-cell:not(.empty):not(.future):active {
  transform: scale(0.95);
}

/* ===== Celebration ===== */
.celebration-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(26, 26, 26, 0.85);
  z-index: 2000;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.celebration-overlay.active {
  display: flex;
  animation: cele-fadein 0.3s ease-out;
}

@keyframes cele-fadein {
  from { opacity: 0; }
  to { opacity: 1; }
}

.celebration-card {
  background: var(--paper);
  border: 4px solid var(--black);
  box-shadow: 8px 8px 0 var(--red);
  padding: 28px 24px 20px;
  max-width: 380px;
  width: 100%;
  text-align: center;
  position: relative;
  animation: cele-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes cele-pop {
  0% { transform: scale(0.6) rotate(-8deg); opacity: 0; }
  60% { transform: scale(1.05) rotate(2deg); }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

/* 背景の幾何学burst */
.celebration-burst {
  position: absolute;
  top: -20px;
  left: -20px;
  right: -20px;
  bottom: -20px;
  pointer-events: none;
  z-index: 0;
  background-image:
    radial-gradient(circle at 10% 20%, var(--yellow) 8px, transparent 9px),
    radial-gradient(circle at 90% 30%, var(--blue) 6px, transparent 7px),
    radial-gradient(circle at 80% 85%, var(--red) 10px, transparent 11px),
    radial-gradient(circle at 15% 85%, var(--blue) 7px, transparent 8px),
    radial-gradient(circle at 50% 5%, var(--yellow) 9px, transparent 10px);
  animation: cele-spin 8s linear infinite;
}

@keyframes cele-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.celebration-img {
  width: 180px;
  height: 180px;
  object-fit: contain;
  position: relative;
  z-index: 1;
  margin: 0 auto 14px;
  display: block;
  animation: cele-bob 1.5s ease-in-out infinite;
}

@keyframes cele-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.celebration-content {
  position: relative;
  z-index: 1;
  margin-bottom: 18px;
}

.celebration-title {
  font-family: 'Archivo Black', sans-serif;
  font-size: clamp(22px, 6vw, 30px);
  letter-spacing: -0.02em;
  text-transform: uppercase;
  background: var(--yellow);
  display: inline-block;
  padding: 4px 12px;
  border: 3px solid var(--black);
  margin-bottom: 10px;
  transform: rotate(-1.5deg);
  box-shadow: 4px 4px 0 var(--black);
}

.celebration-message {
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 900;
  font-size: 15px;
  line-height: 1.5;
  margin-top: 12px;
}

.celebration-close {
  font-family: 'Archivo Black', sans-serif;
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  background: var(--black);
  color: var(--paper);
  border: 3px solid var(--black);
  padding: 10px 28px;
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--red);
  transition: all 0.1s;
  position: relative;
  z-index: 1;
}

.celebration-close:active {
  transform: translate(4px, 4px);
  box-shadow: 0 0 0 var(--red);
}

/* ===== Summary Card ===== */
.summary-card {
  margin-bottom: 22px;
}

.summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 8px;
}

.summary-item {
  border: 2px solid var(--black);
  padding: 10px 8px;
  text-align: center;
  background: var(--paper);
}

.summary-label {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-secondary);
  margin-bottom: 4px;
}

.summary-value {
  font-family: 'Archivo Black', sans-serif;
  font-size: clamp(20px, 5vw, 26px);
  letter-spacing: -0.02em;
  line-height: 1;
}

/* ===== Data Management ===== */
.data-mgmt {
  margin-bottom: 22px;
}

.data-mgmt-desc {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 12px;
  color: var(--text-secondary);
  margin: 6px 0 12px;
  line-height: 1.5;
}

.data-mgmt-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.btn-data {
  font-family: 'Archivo Black', sans-serif;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 10px 12px;
  border: 3px solid var(--black);
  background: var(--paper);
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--black);
  transition: all 0.1s;
}

.btn-data:active {
  transform: translate(4px, 4px);
  box-shadow: 0 0 0 var(--black);
}

/* ===== Hidden ===== */
[hidden] { display: none !important; }

/* ===== Responsive ===== */
@media (max-width: 480px) {
  .app { padding: 12px; }
  .app-header { padding: 12px 14px; }
  .brand-mark { font-size: 16px; }
  .view-tab { padding: 7px 10px; font-size: 10px; }
  .stats-grid { gap: 10px; }
  .stat-card { padding: 12px 14px; }
}
</style>
</head>

const DAY_KEYS = ['mon', 'tue', 'thu', 'sat'];
const REQUIRED_DAY_KEYS = ['mon', 'tue', 'thu']; // ストリーク・週進捗の対象（土はボーナス扱い）
const WEEKDAY_TO_MENU = { 1: 'mon', 2: 'tue', 4: 'thu', 6: 'sat' };
const REQUIRED_WEEKDAY_TO_MENU = { 1: 'mon', 2: 'tue', 4: 'thu' };
const STORAGE_KEY = 'jumpTraining:records';

// ===== State =====
let records = {};
let activeMenu = getTodayMenu();
let monthOffset = 0;

// ===== Utils =====
function getTodayMenu() {
  const day = new Date().getDay();
  return WEEKDAY_TO_MENU[day] || 'mon';
}

function pad(n) { return String(n).padStart(2, '0'); }

function formatDate(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function todayKey() {
  return formatDate(new Date());
}

function loadRecords() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    return migrateRecords(parsed);
  } catch (e) {
    return {};
  }
}

// すべての旧形式を {menu, checks} 形式に変換
function migrateRecords(records) {
  const out = {};
  for (const [date, r] of Object.entries(records)) {
    if (!r) continue;
    if (r.menu && r.checks) {
      // v1形式: そのまま
      out[date] = r;
    } else if (r.menus && typeof r.menus === 'object') {
      // v2形式（複数メニュー）: 最も進捗のあるメニューを採用
      const entries = Object.entries(r.menus);
      if (entries.length === 0) continue;
      let best = entries[0];
      for (const e of entries) {
        const cnt = Object.values(e[1] || {}).filter(Boolean).length;
        const bestCnt = Object.values(best[1] || {}).filter(Boolean).length;
        if (cnt > bestCnt) best = e;
      }
      out[date] = { menu: best[0], checks: best[1] || {} };
    }
  }
  return out;
}

function saveRecords() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  } catch (e) {
    console.error('保存失敗', e);
  }
}

// その日のメニューチェック状態を取得（指定メニューと一致する場合のみ）
function getMenuChecks(date, menuKey) {
  const r = records[date];
  if (!r || r.menu !== menuKey) return {};
  return r.checks || {};
}

// その日のあるメニューの完了状態
function getMenuStatus(date, menuKey) {
  const checks = getMenuChecks(date, menuKey);
  const total = MENUS[menuKey].exercises.length;
  const done = Object.values(checks).filter(Boolean).length;
  if (done === 0) return 'none';
  if (done === total) return 'done';
  return 'partial';
}

// その日に何かしら実施したメニューを取得（1日1メニューなので最大1要素）
function getActiveMenusOnDate(date) {
  const r = records[date];
  if (!r || !r.menu || !r.checks) return [];
  const cnt = Object.values(r.checks).filter(Boolean).length;
  return cnt > 0 ? [r.menu] : [];
}

// その日のメニューが全完了したか（達成判定。準備運動だけは達成扱いしない）
function isDayAchieved(date) {
  const r = records[date];
  if (!r || !r.menu || !r.checks) return false;
  const cnt = Object.values(r.checks).filter(Boolean).length;
  const total = MENUS[r.menu] ? MENUS[r.menu].exercises.length : 0;
  return total > 0 && cnt === total;
}

// 月曜始まりの「今週」の進捗を計算
// 全完了した日のみカウント（部分実施は対象外）
function getWeekProgress() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const dow = today.getDay();
  const daysFromMon = dow === 0 ? 6 : dow - 1;
  const monday = new Date(today);
  monday.setDate(monday.getDate() - daysFromMon);

  let days = 0;
  let exDone = false;

  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    if (d > today) break;
    const key = formatDate(d);
    if (isDayAchieved(key)) {
      days++;
      const r = records[key];
      if (r.menu === 'sat') exDone = true;
    }
  }

  const requiredTotal = 3;
  return {
    done: Math.min(days, requiredTotal),
    extra: Math.max(0, days - requiredTotal),
    totalDays: days,
    requiredTotal,
    bonus: exDone,
  };
}

// ストリーク：週単位での「3日達成」連続を見る（全完了した日のみカウント）
function computeStreak() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const dow = today.getDay();
  const daysFromMonNow = dow === 0 ? 6 : dow - 1;

  let streak = 0;

  for (let weekOffset = 0; weekOffset < 52; weekOffset++) {
    const targetMonday = new Date(today);
    targetMonday.setDate(today.getDate() - daysFromMonNow - 7 * weekOffset);
    const isCurrentWeek = weekOffset === 0;

    // 該当週の全完了した日数を数える（月～日）
    let weekDays = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(targetMonday);
      d.setDate(targetMonday.getDate() + i);
      if (d > today) break;
      const key = formatDate(d);
      if (isDayAchieved(key)) {
        weekDays++;
      }
    }

    if (isCurrentWeek) {
      streak += weekDays;
    } else {
      if (weekDays >= 3) {
        streak += weekDays;
      } else {
        break;
      }
    }
  }

  return streak;
}

// ===== Day tabs =====
function renderWeekSummary() {
  const wp = getWeekProgress();
  const streak = computeStreak();
  const isComplete = wp.done >= wp.requiredTotal;
  const percent = (wp.done / wp.requiredTotal) * 100;

  document.getElementById('week-summary').innerHTML = `

        <span class="ws-denom">/ ${wp.requiredTotal}</span>

      </div>
      <div class="ws-bar">
        <div class="ws-bar-fill ${isComplete ? 'complete' : ''}" style="width: ${Math.min(percent, 100)}%"></div>
      </div>
    </div>
    <div class="ws-cell streak">
      <span class="section-label">Streak</span>
      <div class="ws-row">
        <span class="ws-num">${streak}</span>
        <span class="ws-denom">DAYS${streak >= 3 ? '<span class="ws-flame">🔥</span>' : ''}</span>

}

function toggleExercise(exId) {
  const date = todayKey();
  const existing = records[date];

  // 既に別のメニューで進捗がある場合、変更確認
  if (existing && existing.menu !== activeMenu) {
    const cnt = Object.values(existing.checks || {}).filter(Boolean).length;
    if (cnt > 0) {
      const ok = confirm(
        `本日は既に「${MENUS[existing.menu].label} ${MENUS[existing.menu].titleJp}」を実施中です（${cnt}個チェック済み）。\n\n` +
        `「${MENUS[activeMenu].label} ${MENUS[activeMenu].titleJp}」に変更しますか？\n` +
        `（現在の進捗は失われます）`
      );
      if (!ok) {
        // キャンセル → 元のメニューに戻す
        activeMenu = existing.menu;
        renderTodayView();
        return;
      }
    }
  }

  // 変更前の状態を記録
  const prevState = getCurrentState();

  // レコード作成 or メニュー変更
  if (!records[date] || records[date].menu !== activeMenu) {
    records[date] = { menu: activeMenu, checks: {} };
  }

  records[date].checks[exId] = !records[date].checks[exId];
  saveRecords();
  renderTodayView();

  // 変更後の状態
  const currentState = getCurrentState();

  // お祝いトリガー判定
  const triggers = checkCelebrations(prevState, currentState);
  if (triggers.length > 0) {
    queueCelebration(triggers);
  }
}

// ===== History view =====
function renderHistoryView() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const target = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
  const year = target.getFullYear();
  const month = target.getMonth();
  document.getElementById('month-label').textContent = `${year} / ${pad(month + 1)}`;

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const daysInMonth = lastDay.getDate();
  // 月曜始まり: 月=0, 火=1, ..., 日=6 に変換
  const startWeekday = (firstDay.getDay() + 6) % 7;

  // 月内の実施日数（何かしらチェックがあった日）
  let monthCount = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const key = formatDate(new Date(year, month, d));
    if (getActiveMenusOnDate(key).length > 0) monthCount++;
  }
  document.getElementById('stat-month').innerHTML = `${monthCount}<span class="stat-unit">DAYS</span>`;

  // ストリーク
  const streak = computeStreak();
  document.getElementById('stat-streak').innerHTML = `${streak}<span class="stat-unit">DAYS</span>`;

  // 月曜始まり: Mon, Tue, Wed, Thu, Fri, Sat, Sun
  const weekdays = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  document.getElementById('weekday-header').innerHTML = weekdays.map((w, i) => {
    const cls = i === 5 ? 'sat' : i === 6 ? 'sun' : '';
    return `<div class="weekday-cell ${cls}">${w}</div>`;
  }).join('');

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const grid = document.getElementById('calendar-grid');
  grid.innerHTML = cells.map(d => {
    if (d === null) return '<div class="cal-cell empty"></div>';
    const date = new Date(year, month, d);
    const key = formatDate(date);
    const dow = date.getDay();
    const expectedMenu = WEEKDAY_TO_MENU[dow];
    const activeMenus = getActiveMenusOnDate(key); // 実施した全メニュー
    const isFuture = date > today && key !== todayKey();
    const isToday = key === todayKey();

    // この日に「全完了」したメニューが1つでもあるか
    let hasDone = false;
    let hasPartial = false;
    for (const k of activeMenus) {
      const status = getMenuStatus(key, k);
      if (status === 'done') hasDone = true;
      else if (status === 'partial') hasPartial = true;
    }

    let cls = 'cal-cell';
    if (hasDone) cls += ' done';
    else if (hasPartial) cls += ' partial';
    else if (expectedMenu) cls += ' scheduled';
    if (isToday) cls += ' today';
    if (isFuture) cls += ' future';

    // 実施した全メニューのラベルを表示
    let mark = '';
    if (activeMenus.length > 0) {
      const labels = activeMenus.map(k => MENUS[k].label).join('');
      mark = `<span class="cal-mark">${labels}</span>`;
    }

    const dataAttr = isFuture ? '' : `data-date="${key}"`;
    return `<div class="${cls}" ${dataAttr}><span class="cal-day">${d}</span>${mark}</div>`;
  }).join('');

  // セルクリックイベント
  grid.querySelectorAll('.cal-cell[data-date]').forEach(cell => {
    cell.addEventListener('click', () => {
      const date = cell.dataset.date;
      showPastEditModal(date);
    });
  });

  document.getElementById('next-month').disabled = monthOffset >= 0;
  renderSummary();
}

function setPastRecord(menuKey) {
  if (!pastEditDate) return;
  const menu = MENUS[menuKey];
  if (!menu) return;

  const isToday = pastEditDate === todayKey();

  // 今日の編集なら変更前の状態を保存（演出発火用）
  let prevState = null;
  if (isToday) {
    const tempActive = activeMenu;
    activeMenu = menuKey;
    prevState = getCurrentState();
    activeMenu = tempActive;
  }

  const checks = {};
  menu.exercises.forEach(ex => { checks[ex.id] = true; });
  records[pastEditDate] = { menu: menuKey, checks };
  saveRecords();
  hidePastEditModal();
  renderHistoryView();

  // Today画面の表示も更新（今日のレコードを変更した場合）
  if (isToday) {
    activeMenu = menuKey;
    renderTodayView();
    // 演出チェック
    const currentState = getCurrentState();
    const triggers = checkCelebrations(prevState, currentState);
    if (triggers.length > 0) {
      queueCelebration(triggers);
    }
  }
}

function deletePastRecord() {
  if (!pastEditDate) return;
  if (!confirm('この日の記録を削除しますか？')) return;
  delete records[pastEditDate];
  saveRecords();
  hidePastEditModal();
  renderHistoryView();
  if (pastEditDate === todayKey()) {
    renderTodayView();
  }
}

// ===== Celebration System =====
const CELEBRATION_KEY = 'jumpTraining:celebrations';

function loadCelebrations() {
  try {
    const raw = localStorage.getItem(CELEBRATION_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveCelebrations(c) {
  try {
    localStorage.setItem(CELEBRATION_KEY, JSON.stringify(c));
  } catch (e) {}
}

// トリガー定義: 達成内容に応じてお祝い演出
function checkCelebrations(prev, current) {
  // prev: 変更前の状態 { menuDone: bool, weekDays: number, streak: number }
  // current: 変更後の状態
  const cele = loadCelebrations();
  const today = todayKey();
  const triggers = [];

  // 1. メニュー完了（同じ日の同じメニューは1回だけ）
  if (!prev.menuDone && current.menuDone) {
    const menuKey = `menu:${today}:${activeMenu}`;
    if (!cele[menuKey]) {
      cele[menuKey] = true;
      triggers.push({
        type: 'menu_complete',
        menu: activeMenu,
        // 序盤かどうかで演出の強度を決める
        isFirstTime: !cele['first_complete'],
      });
      if (!cele['first_complete']) cele['first_complete'] = true;
    }
  }

  // 2. This Week 日数の増加
  // 1日目・2日目は初週のみ（全期間で1回）、3日目以降は毎週
  if (current.weekDays > prev.weekDays) {
    const count = current.weekDays;
    if (count === 1 || count === 2) {
      // 初週のみ
      const firstKey = `first_week_day:${count}`;
      if (!cele[firstKey]) {
        cele[firstKey] = true;
        triggers.push({ type: 'week_progress', count });
      }
    } else if (count >= 3 && count <= 7) {
      // 毎週（3日達成、4日目以降）
      const weekKey = `week:${getWeekKey()}:${count}`;
      if (!cele[weekKey]) {
        cele[weekKey] = true;
        triggers.push({ type: 'week_progress', count });
      }
    }
  }

  // 3. Streak のマイルストーン
  const milestones = [3, 5, 7, 10, 14, 21, 30, 50, 100];
  for (const m of milestones) {
    if (prev.streak < m && current.streak >= m) {
      const sKey = `streak:${m}`;
      if (!cele[sKey]) {
        cele[sKey] = true;
        triggers.push({ type: 'streak_milestone', value: m });
      }
    }
  }

  saveCelebrations(cele);
  return triggers;
}

function getWeekKey() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const dow = today.getDay();
  const daysFromMon = dow === 0 ? 6 : dow - 1;
  const monday = new Date(today);
  monday.setDate(today.getDate() - daysFromMon);
  return formatDate(monday);
}

function getCurrentState() {
  const today = todayKey();
  const wp = getWeekProgress();
  const streak = computeStreak();
  // メニュー完了判定
  const r = records[today];
  let menuDone = false;
  if (r && r.menu === activeMenu && r.checks) {
    const cnt = Object.values(r.checks).filter(Boolean).length;
    const total = MENUS[activeMenu].exercises.length;
    menuDone = cnt === total;
  }
  return { menuDone, weekDays: wp.totalDays, streak };
}

// 演出のキューと表示制御
let celebrationQueue = [];
let celebrationActive = false;

function queueCelebration(triggers) {
  celebrationQueue.push(...triggers);
  if (!celebrationActive) showNextCelebration();
}

function showNextCelebration() {
  if (celebrationQueue.length === 0) {
    celebrationActive = false;
    return;
  }
  celebrationActive = true;
  const t = celebrationQueue.shift();
  const config = buildCelebrationConfig(t);
  showCelebration(config);
}

function buildCelebrationConfig(trigger) {
  const menuLabel = MENUS[activeMenu] ? MENUS[activeMenu].label : '';
  const menuJp = MENUS[activeMenu] ? MENUS[activeMenu].titleJp : '';

  if (trigger.type === 'menu_complete') {
    if (trigger.isFirstTime) {
      return {

function showCelebration(config) {
  if (!config) {
    showNextCelebration();
    return;
  }
  const overlay = document.getElementById('celebration-modal');
  document.getElementById('celebration-img').src = HIROKI_IMAGES[config.img] || HIROKI_IMAGES.normal;
  document.getElementById('celebration-title').textContent = config.title;
  document.getElementById('celebration-message').textContent = config.message;
  overlay.classList.add('active');
}

function closeCelebration() {
  document.getElementById('celebration-modal').classList.remove('active');
  setTimeout(() => showNextCelebration(), 300);
}

// ===== All Time Summary =====
function computeAllTimeSummary() {
  let totalDays = 0;
  let bestStreak = 0;
  let achievedWeeks = 0;

  // 全実施日カウント
  const sortedDates = Object.keys(records).sort();
  for (const date of sortedDates) {
    const r = records[date];
    if (r && r.checks && Object.values(r.checks).filter(Boolean).length > 0) {
      totalDays++;
    }
  }

  // 最長ストリーク（過去全期間で最長の連続実施日数）
  // 各日について、前日からの連続日数を計算
  if (sortedDates.length > 0) {
    let currentRun = 0;
    let prevDate = null;
    for (const date of sortedDates) {
      const r = records[date];
      const did = r && r.checks && Object.values(r.checks).filter(Boolean).length > 0;
      if (!did) continue;
      
      if (prevDate === null) {
        currentRun = 1;
      } else {
        // 前回実施日からのギャップを計算（必須日でない日はスキップ）
        const prev = new Date(prevDate);
        const curr = new Date(date);
        let gap = 0;
        let valid = true;
        const cursor = new Date(prev);
        cursor.setDate(cursor.getDate() + 1);
        while (cursor < curr) {
          const wd = cursor.getDay();
          const isRequired = !!REQUIRED_WEEKDAY_TO_MENU[wd];
          if (isRequired) {
            // 必須日に空きがある → 連続途切れ
            valid = false;
            break;
          }
          cursor.setDate(cursor.getDate() + 1);
        }
        if (valid) {
          currentRun++;
        } else {
          if (currentRun > bestStreak) bestStreak = currentRun;
          currentRun = 1;
        }
      }
      if (currentRun > bestStreak) bestStreak = currentRun;
      prevDate = date;
    }
  }

  // 達成週数（過去で3日以上実施した週の数）
  // 月曜始まりで全週をスキャン
  if (sortedDates.length > 0) {
    const weekCounts = {};
    for (const date of sortedDates) {
      const r = records[date];
      if (!r || !r.checks) continue;
      const cnt = Object.values(r.checks).filter(Boolean).length;
      if (cnt === 0) continue;
      const d = new Date(date);
      const dow = d.getDay();
      const daysFromMon = dow === 0 ? 6 : dow - 1;
      const monday = new Date(d);
      monday.setDate(d.getDate() - daysFromMon);
      const wkKey = formatDate(monday);
      weekCounts[wkKey] = (weekCounts[wkKey] || 0) + 1;
    }
    achievedWeeks = Object.values(weekCounts).filter(c => c >= 3).length;
  }

  return { totalDays, bestStreak, achievedWeeks };
}

function renderSummary() {
  const s = computeAllTimeSummary();
  document.getElementById('summary-total').textContent = s.totalDays;
  document.getElementById('summary-best').textContent = s.bestStreak;
  document.getElementById('summary-weeks').textContent = s.achievedWeeks;
}

// ===== Backup / Restore =====
function exportData() {
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    records: records,
    celebrations: loadCelebrations(),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ymd = formatDate(new Date());
  a.href = url;
  a.download = `jump_training_backup_${ymd}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.records || typeof data.records !== 'object') {
        alert('バックアップファイルの形式が正しくありません。');
        return;
      }
      const existingCount = Object.keys(records).length;
      const importCount = Object.keys(data.records).length;
      const ok = confirm(
        `バックアップを読み込みますか？\n\n` +
        `現在の記録: ${existingCount}日分\n` +
        `読み込む記録: ${importCount}日分\n\n` +
        `※ 現在の記録は上書きされます。`
      );
      if (!ok) return;
      records = migrateRecords(data.records);
      saveRecords();
      if (data.celebrations) {
        saveCelebrations(data.celebrations);
      }
      alert('読み込み完了。');
      renderTodayView();
      renderHistoryView();
    } catch (err) {
      alert('ファイルの読み込みに失敗しました。\n' + err.message);
    }
  };
  reader.readAsText(file);
}

// ===== View switching =====
function switchView(view) {
  document.querySelectorAll('.view-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  document.getElementById('view-today').hidden = view !== 'today';
  document.getElementById('view-history').hidden = view !== 'history';
  if (view === 'history') renderHistoryView();
}

// ===== Init =====
function init() {
  records = loadRecords();
  const todayK = todayKey();

  // 既に今日のレコードがあればそのメニューを開く、なければ選択モーダル
  if (records[todayK] && records[todayK].menu) {
    activeMenu = records[todayK].menu;
  } else {
    // 今日が予定日ならそのメニュー、そうでなければデフォルト
    activeMenu = getTodayMenu();
    showDaySelectModal();
  }

  renderTodayView();

  document.querySelectorAll('.view-tab').forEach(btn => {
    btn.addEventListener('click', () => switchView(btn.dataset.view));
  });

  document.querySelectorAll('.day-option').forEach(btn => {
    btn.addEventListener('click', () => {
      activeMenu = btn.dataset.day;
      hideDaySelectModal();
      renderTodayView();
    });
  });

  document.getElementById('modal-skip').addEventListener('click', hideDaySelectModal);

  // 過去日付編集モーダル
  document.querySelectorAll('.past-edit-option').forEach(btn => {
    btn.addEventListener('click', () => {
      setPastRecord(btn.dataset.day);
    });
  });
  document.getElementById('past-edit-delete').addEventListener('click', deletePastRecord);
  document.getElementById('past-edit-cancel').addEventListener('click', hidePastEditModal);

  // お祝いモーダル
  document.getElementById('celebration-close').addEventListener('click', closeCelebration);

  // エクスポート/インポート
  document.getElementById('btn-export').addEventListener('click', exportData);
  document.getElementById('btn-import').addEventListener('click', () => {
    document.getElementById('import-file').click();
  });
  document.getElementById('import-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) importData(file);
    e.target.value = ''; // リセット
  });

  document.getElementById('prev-month').addEventListener('click', () => {
    monthOffset--;
    renderHistoryView();
  });
  document.getElementById('next-month').addEventListener('click', () => {
    if (monthOffset < 0) {
      monthOffset++;
      renderHistoryView();
    }
  });
}

init();
